name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.15.22
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # validate needs no login; pinning keeps its checks from changing under us.
      - run: npm install --global @anthropic-ai/claude-code@2.1.318 # zizmor: ignore[adhoc-packages] pinned version; no lockfile for one CLI
      - run: for plugin in plugins/*/; do claude plugin validate "$plugin"; done
      - run: .github/checks/mcp-tool-names.sh
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          curl -sSfL -o actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: zizmor
        run: |
          python3 -m pip install zizmor==1.31.1 # zizmor: ignore[adhoc-packages] pinned version; no lockfile for one CLI
          zizmor --offline --format=github .github/workflows/
